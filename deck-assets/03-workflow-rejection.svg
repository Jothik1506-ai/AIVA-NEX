<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="a_ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker><marker id="a_priv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="a_srv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="a_rej" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="a_llm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="a_cloud" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="a_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="80" y="92" font-size="50" font-weight="800" fill="#0F172A">Workflow 3 - Request gate and rejection</text><text x="80" y="140" font-size="26" fill="#475569">server/security.py middleware, then /analyze checks in server/main.py (outermost first)</text><rect x="80" y="330" width="250" height="150" rx="18" fill="#C2410C14" stroke="#C2410C" stroke-width="4"/><text x="205.0" y="375.0" text-anchor="middle" font-size="30" font-weight="700" fill="#C2410C">CORS</text><text x="205.0" y="413.0" text-anchor="middle" font-size="23" fill="#0F172A">extension origin</text><text x="205.0" y="443.0" text-anchor="middle" font-size="23" fill="#0F172A">or localhost</text><rect x="375" y="330" width="250" height="150" rx="18" fill="#C2410C14" stroke="#C2410C" stroke-width="4"/><text x="500.0" y="375.0" text-anchor="middle" font-size="30" font-weight="700" fill="#C2410C">Body cap</text><text x="500.0" y="413.0" text-anchor="middle" font-size="23" fill="#0F172A">256 KB</text><text x="500.0" y="443.0" text-anchor="middle" font-size="23" fill="#0F172A">(/perceive 4 MB)</text><path d="M330,405.0 L369,405.0" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><text x="349.5" y="391.0" text-anchor="middle" font-size="22" font-style="italic" fill="#475569" stroke="#fff" stroke-width="7" paint-order="stroke">ok</text><rect x="670" y="330" width="250" height="150" rx="18" fill="#C2410C14" stroke="#C2410C" stroke-width="4"/><text x="795.0" y="375.0" text-anchor="middle" font-size="30" font-weight="700" fill="#C2410C">Token</text><text x="795.0" y="413.0" text-anchor="middle" font-size="23" fill="#0F172A">X-Aiva-Token</text><text x="795.0" y="443.0" text-anchor="middle" font-size="23" fill="#0F172A">constant-time</text><path d="M625,405.0 L664,405.0" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><text x="644.5" y="391.0" text-anchor="middle" font-size="22" font-style="italic" fill="#475569" stroke="#fff" stroke-width="7" paint-order="stroke">ok</text><rect x="965" y="330" width="250" height="150" rx="18" fill="#04785714" stroke="#047857" stroke-width="4"/><text x="1090.0" y="360.0" text-anchor="middle" font-size="30" font-weight="700" fill="#047857">PII check</text><text x="1090.0" y="398.0" text-anchor="middle" font-size="23" fill="#0F172A">Aadhaar Verhoeff,</text><text x="1090.0" y="428.0" text-anchor="middle" font-size="23" fill="#0F172A">card Luhn, PAN,</text><text x="1090.0" y="458.0" text-anchor="middle" font-size="23" fill="#0F172A">phone, email</text><path d="M920,405.0 L959,405.0" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><text x="939.5" y="391.0" text-anchor="middle" font-size="22" font-style="italic" fill="#475569" stroke="#fff" stroke-width="7" paint-order="stroke">ok</text><rect x="1260" y="330" width="250" height="150" rx="18" fill="#04785714" stroke="#047857" stroke-width="4"/><text x="1385.0" y="375.0" text-anchor="middle" font-size="30" font-weight="700" fill="#047857">NER policy</text><text x="1385.0" y="413.0" text-anchor="middle" font-size="23" fill="#0F172A">tokenize (default)</text><text x="1385.0" y="443.0" text-anchor="middle" font-size="23" fill="#0F172A">reject | off</text><path d="M1215,405.0 L1254,405.0" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><text x="1234.5" y="391.0" text-anchor="middle" font-size="22" font-style="italic" fill="#475569" stroke="#fff" stroke-width="7" paint-order="stroke">ok</text><rect x="1555" y="330" width="250" height="150" rx="18" fill="#6D28D914" stroke="#6D28D9" stroke-width="4"/><text x="1680.0" y="375.0" text-anchor="middle" font-size="30" font-weight="700" fill="#6D28D9">Decide</text><text x="1680.0" y="413.0" text-anchor="middle" font-size="23" fill="#0F172A">local LLM or</text><text x="1680.0" y="443.0" text-anchor="middle" font-size="23" fill="#0F172A">rule engine</text><path d="M1510,405.0 L1549,405.0" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><text x="1529.5" y="391.0" text-anchor="middle" font-size="22" font-style="italic" fill="#475569" stroke="#fff" stroke-width="7" paint-order="stroke">ok</text><rect x="375" y="640" width="250" height="150" rx="18" fill="#B91C1C14" stroke="#B91C1C" stroke-width="4"/><text x="500.0" y="700.0" text-anchor="middle" font-size="30" font-weight="700" fill="#B91C1C">413</text><text x="500.0" y="738.0" text-anchor="middle" font-size="23" fill="#0F172A">too large</text><path d="M500.0,480 L500.0,634" fill="none" stroke="#B91C1C" stroke-width="4" marker-end="url(#a_rej)"/><rect x="670" y="640" width="250" height="150" rx="18" fill="#B91C1C14" stroke="#B91C1C" stroke-width="4"/><text x="795.0" y="700.0" text-anchor="middle" font-size="30" font-weight="700" fill="#B91C1C">401</text><text x="795.0" y="738.0" text-anchor="middle" font-size="23" fill="#0F172A">bad / missing token</text><path d="M795.0,480 L795.0,634" fill="none" stroke="#B91C1C" stroke-width="4" marker-end="url(#a_rej)"/><rect x="965" y="640" width="250" height="150" rx="18" fill="#B91C1C14" stroke="#B91C1C" stroke-width="4"/><text x="1090.0" y="685.0" text-anchor="middle" font-size="30" font-weight="700" fill="#B91C1C">400</text><text x="1090.0" y="723.0" text-anchor="middle" font-size="23" fill="#0F172A">type named only,</text><text x="1090.0" y="753.0" text-anchor="middle" font-size="23" fill="#0F172A">value never echoed</text><path d="M1090.0,480 L1090.0,634" fill="none" stroke="#B91C1C" stroke-width="4" marker-end="url(#a_rej)"/><rect x="1260" y="640" width="250" height="150" rx="18" fill="#B91C1C14" stroke="#B91C1C" stroke-width="4"/><text x="1385.0" y="685.0" text-anchor="middle" font-size="30" font-weight="700" fill="#B91C1C">400</text><text x="1385.0" y="723.0" text-anchor="middle" font-size="23" fill="#0F172A">reject policy +</text><text x="1385.0" y="753.0" text-anchor="middle" font-size="23" fill="#0F172A">name/address hit</text><path d="M1385.0,480 L1385.0,634" fill="none" stroke="#B91C1C" stroke-width="4" marker-end="url(#a_rej)"/><rect x="1555" y="640" width="250" height="150" rx="18" fill="#1D4ED814" stroke="#1D4ED8" stroke-width="4"/><text x="1680.0" y="685.0" text-anchor="middle" font-size="30" font-weight="700" fill="#1D4ED8">Action JSON</text><text x="1680.0" y="723.0" text-anchor="middle" font-size="23" fill="#0F172A">click / focus /</text><text x="1680.0" y="753.0" text-anchor="middle" font-size="23" fill="#0F172A">scroll / summarize</text><path d="M1680.0,480 L1680.0,634" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><text x="80" y="880" text-anchor="start" font-size="24" font-weight="400" fill="#0F172A">Panel shows the reason (e.g. &quot;Rejected: possible raw PII detected (AADHAAR)&quot;); nothing is sent to any model.</text><text x="80" y="920" text-anchor="start" font-size="24" font-weight="400" fill="#0F172A">422 validation errors never echo the submitted input. No bodies, headers or tokens are logged.</text><rect x="80" y="1025" width="26" height="26" rx="6" fill="#1D4ED822" stroke="#1D4ED8" stroke-width="3"/><text x="116" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Browser extension (on-device)</text><rect x="485" y="1025" width="26" height="26" rx="6" fill="#04785722" stroke="#047857" stroke-width="3"/><text x="521" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Privacy step</text><rect x="703" y="1025" width="26" height="26" rx="6" fill="#C2410C22" stroke="#C2410C" stroke-width="3"/><text x="739" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Local server 127.0.0.1:8000</text><rect x="1086" y="1025" width="26" height="26" rx="6" fill="#6D28D922" stroke="#6D28D9" stroke-width="3"/><text x="1122" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Local LLM / rules</text><rect x="1359" y="1025" width="26" height="26" rx="6" fill="#B91C1C22" stroke="#B91C1C" stroke-width="3"/><text x="1395" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Rejected</text><rect x="1533" y="1025" width="26" height="26" rx="6" fill="#64748B22" stroke="#64748B" stroke-width="3"/><text x="1569" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Optional cloud (off by default)</text></svg>