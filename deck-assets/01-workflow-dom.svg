<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="a_ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker><marker id="a_priv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="a_srv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="a_rej" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="a_llm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="a_cloud" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="a_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="80" y="92" font-size="50" font-weight="800" fill="#0F172A">Workflow 1 - DOM mode: scan to action</text><text x="80" y="140" font-size="26" fill="#475569">Every PII candidate is tokenised in the browser; the local server re-checks before any model sees the page</text><rect x="80" y="300" width="300" height="190" rx="18" fill="#1D4ED814" stroke="#1D4ED8" stroke-width="4"/><text x="230.0" y="350.0" text-anchor="middle" font-size="30" font-weight="700" fill="#1D4ED8">1  Scan Page</text><text x="230.0" y="388.0" text-anchor="middle" font-size="23" fill="#0F172A">content.js builds</text><text x="230.0" y="418.0" text-anchor="middle" font-size="23" fill="#0F172A">screen graph</text><text x="230.0" y="448.0" text-anchor="middle" font-size="23" fill="#0F172A">(fields, buttons, links)</text><rect x="442" y="300" width="300" height="190" rx="18" fill="#04785714" stroke="#047857" stroke-width="4"/><text x="592.0" y="350.0" text-anchor="middle" font-size="30" font-weight="700" fill="#047857">2  Tokenise PII</text><text x="592.0" y="388.0" text-anchor="middle" font-size="23" fill="#0F172A">pii-checks.js + ner-rules.js</text><text x="592.0" y="418.0" text-anchor="middle" font-size="23" fill="#0F172A">EMAIL_1, ID_NUMBER_1,</text><text x="592.0" y="448.0" text-anchor="middle" font-size="23" fill="#0F172A">PERSON_1, ADDRESS_1</text><rect x="804" y="300" width="300" height="190" rx="18" fill="#C2410C14" stroke="#C2410C" stroke-width="4"/><text x="954.0" y="350.0" text-anchor="middle" font-size="30" font-weight="700" fill="#C2410C">3  Server re-check</text><text x="954.0" y="388.0" text-anchor="middle" font-size="23" fill="#0F172A">POST /analyze + token</text><text x="954.0" y="418.0" text-anchor="middle" font-size="23" fill="#0F172A">Verhoeff / Luhn / PAN</text><text x="954.0" y="448.0" text-anchor="middle" font-size="23" fill="#0F172A">spaCy NER policy</text><rect x="1166" y="300" width="300" height="190" rx="18" fill="#6D28D914" stroke="#6D28D9" stroke-width="4"/><text x="1316.0" y="350.0" text-anchor="middle" font-size="30" font-weight="700" fill="#6D28D9">4  Choose action</text><text x="1316.0" y="388.0" text-anchor="middle" font-size="23" fill="#0F172A">local LLM (Ollama /</text><text x="1316.0" y="418.0" text-anchor="middle" font-size="23" fill="#0F172A">LM Studio) or</text><text x="1316.0" y="448.0" text-anchor="middle" font-size="23" fill="#0F172A">rule engine fallback</text><rect x="1528" y="300" width="300" height="190" rx="18" fill="#1D4ED814" stroke="#1D4ED8" stroke-width="4"/><text x="1678.0" y="350.0" text-anchor="middle" font-size="30" font-weight="700" fill="#1D4ED8">5  Execute</text><text x="1678.0" y="388.0" text-anchor="middle" font-size="23" fill="#0F172A">content.js:</text><text x="1678.0" y="418.0" text-anchor="middle" font-size="23" fill="#0F172A">click / focus /</text><text x="1678.0" y="448.0" text-anchor="middle" font-size="23" fill="#0F172A">scroll / summarize</text><path d="M380,395.0 L436,395.0" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><path d="M742,395.0 L798,395.0" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><path d="M1104,395.0 L1160,395.0" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><path d="M1466,395.0 L1522,395.0" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><text x="592.0" y="540" text-anchor="middle" font-size="22" font-weight="700" fill="#047857">raw values never</text><text x="592.0" y="568" text-anchor="middle" font-size="22" font-weight="700" fill="#047857">leave the page</text><rect x="804" y="700" width="300" height="150" rx="18" fill="#B91C1C14" stroke="#B91C1C" stroke-width="4"/><text x="954.0" y="745.0" text-anchor="middle" font-size="30" font-weight="700" fill="#B91C1C">400 Rejected</text><text x="954.0" y="783.0" text-anchor="middle" font-size="23" fill="#0F172A">validated PII or</text><text x="954.0" y="813.0" text-anchor="middle" font-size="23" fill="#0F172A">NER reject policy</text><path d="M954.0,490 L954.0,694" fill="none" stroke="#B91C1C" stroke-width="4" marker-end="url(#a_rej)"/><text x="964.0" y="610" text-anchor="middle" font-size="22" font-style="italic" fill="#B91C1C" stroke="#fff" stroke-width="7" paint-order="stroke">if a leak slips through</text><rect x="1346.0" y="700" width="330" height="150" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="4" stroke-dasharray="14 10"/><text x="1511.0" y="745.0" text-anchor="middle" font-size="30" font-weight="700" fill="#64748B">Gemini (optional)</text><text x="1511.0" y="783.0" text-anchor="middle" font-size="23" fill="#0F172A">/chat only, needs</text><text x="1511.0" y="813.0" text-anchor="middle" font-size="23" fill="#0F172A">AIVA_ALLOW_CLOUD=1 + key</text><text x="80" y="950" text-anchor="start" font-size="24" font-weight="400" fill="#0F172A">Screen graph keeps domain only (no full URL), positions rounded to 5 px, no original value of any sensitive field.</text><rect x="80" y="1025" width="26" height="26" rx="6" fill="#1D4ED822" stroke="#1D4ED8" stroke-width="3"/><text x="116" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Browser extension (on-device)</text><rect x="485" y="1025" width="26" height="26" rx="6" fill="#04785722" stroke="#047857" stroke-width="3"/><text x="521" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Privacy step</text><rect x="703" y="1025" width="26" height="26" rx="6" fill="#C2410C22" stroke="#C2410C" stroke-width="3"/><text x="739" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Local server 127.0.0.1:8000</text><rect x="1086" y="1025" width="26" height="26" rx="6" fill="#6D28D922" stroke="#6D28D9" stroke-width="3"/><text x="1122" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Local LLM / rules</text><rect x="1359" y="1025" width="26" height="26" rx="6" fill="#B91C1C22" stroke="#B91C1C" stroke-width="3"/><text x="1395" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Rejected</text><rect x="1533" y="1025" width="26" height="26" rx="6" fill="#64748B22" stroke="#64748B" stroke-width="3"/><text x="1569" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Optional cloud (off by default)</text></svg>