<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="a_ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker><marker id="a_priv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="a_srv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="a_rej" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="a_llm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="a_cloud" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="a_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="80" y="92" font-size="50" font-weight="800" fill="#0F172A">Client-side architecture - AIVA-NEX</text><text x="80" y="140" font-size="26" fill="#475569">Chrome MV3 extension + local FastAPI server. Default config: no network call leaves the machine.</text><rect x="50" y="180" width="1100" height="690" rx="24" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-dasharray="6 8"/><text x="70" y="216" font-size="24" font-weight="700" fill="#1D4ED8">Chrome extension (Manifest V3, plain JS)</text><rect x="90" y="240" width="480" height="170" rx="18" fill="#1D4ED814" stroke="#1D4ED8" stroke-width="4"/><text x="330.0" y="280.0" text-anchor="middle" font-size="30" font-weight="700" fill="#1D4ED8">Side panel</text><text x="330.0" y="318.0" text-anchor="middle" font-size="23" fill="#0F172A">popup.js / vision.js / settings.js</text><text x="330.0" y="348.0" text-anchor="middle" font-size="23" fill="#0F172A">Scan, Visual toggle, Send, Execute</text><text x="330.0" y="378.0" text-anchor="middle" font-size="23" fill="#0F172A">screenshot masking (OffscreenCanvas)</text><rect x="630" y="240" width="480" height="170" rx="18" fill="#1D4ED814" stroke="#1D4ED8" stroke-width="4"/><text x="870.0" y="280.0" text-anchor="middle" font-size="30" font-weight="700" fill="#1D4ED8">background.js</text><text x="870.0" y="318.0" text-anchor="middle" font-size="23" fill="#0F172A">service worker: ONLY network code</text><text x="870.0" y="348.0" text-anchor="middle" font-size="23" fill="#0F172A">serverFetch() adds X-Aiva-Token</text><text x="870.0" y="378.0" text-anchor="middle" font-size="23" fill="#0F172A">(token in chrome.storage.local)</text><rect x="90" y="480" width="480" height="170" rx="18" fill="#1D4ED814" stroke="#1D4ED8" stroke-width="4"/><text x="330.0" y="520.0" text-anchor="middle" font-size="30" font-weight="700" fill="#1D4ED8">Content scripts</text><text x="330.0" y="558.0" text-anchor="middle" font-size="23" fill="#0F172A">content.js: scan / tokenise / execute</text><text x="330.0" y="588.0" text-anchor="middle" font-size="23" fill="#0F172A">vision-content.js: mask rects only</text><text x="330.0" y="618.0" text-anchor="middle" font-size="23" fill="#0F172A">memory.js: on-device facts</text><rect x="630" y="480" width="225" height="170" rx="18" fill="#04785714" stroke="#047857" stroke-width="4"/><text x="742.5" y="520.0" text-anchor="middle" font-size="30" font-weight="700" fill="#047857">pii-checks.js</text><text x="742.5" y="558.0" text-anchor="middle" font-size="23" fill="#0F172A">regex +</text><text x="742.5" y="588.0" text-anchor="middle" font-size="23" fill="#0F172A">Verhoeff / Luhn</text><text x="742.5" y="618.0" text-anchor="middle" font-size="23" fill="#0F172A">/ PAN</text><rect x="885" y="480" width="225" height="170" rx="18" fill="#04785714" stroke="#047857" stroke-width="4"/><text x="997.5" y="535.0" text-anchor="middle" font-size="30" font-weight="700" fill="#047857">ner-rules.js</text><text x="997.5" y="573.0" text-anchor="middle" font-size="23" fill="#0F172A">Indian names</text><text x="997.5" y="603.0" text-anchor="middle" font-size="23" fill="#0F172A">+ addresses</text><rect x="90" y="720" width="1020" height="110" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="4"/><text x="600.0" y="785.0" text-anchor="middle" font-size="30" font-weight="700" fill="#64748B">Web page (any site / e-gov form)</text><path d="M330,470 L330,416" fill="none" stroke="#1D4ED8" stroke-width="4" marker-end="url(#a_ext)"/><text x="420" y="450" text-anchor="middle" font-size="22" font-style="italic" fill="#1D4ED8" stroke="#fff" stroke-width="7" paint-order="stroke">sanitized graph</text><path d="M576,325 L624,325" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><path d="M330,714 L330,656" fill="none" stroke="#1D4ED8" stroke-width="4" marker-end="url(#a_ext)"/><text x="380" y="695" text-anchor="middle" font-size="22" font-style="italic" fill="#1D4ED8" stroke="#fff" stroke-width="7" paint-order="stroke">DOM</text><path d="M855,565 L861,565" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><path d="M576,565 L624,565" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><rect x="1210" y="180" width="660" height="690" rx="24" fill="none" stroke="#C2410C" stroke-width="3" stroke-dasharray="6 8"/><text x="1230" y="216" font-size="24" font-weight="700" fill="#C2410C">This machine (localhost)</text><rect x="1250" y="240" width="580" height="250" rx="18" fill="#C2410C14" stroke="#C2410C" stroke-width="4"/><text x="1540.0" y="305.0" text-anchor="middle" font-size="30" font-weight="700" fill="#C2410C">Local server 127.0.0.1:8000</text><text x="1540.0" y="343.0" text-anchor="middle" font-size="23" fill="#0F172A">security.py: CORS, caps, token</text><text x="1540.0" y="373.0" text-anchor="middle" font-size="23" fill="#0F172A">pii_checks.py + ner/ (spaCy sm)</text><text x="1540.0" y="403.0" text-anchor="middle" font-size="23" fill="#0F172A">vision/: RapidOCR ONNX + OpenCV</text><text x="1540.0" y="433.0" text-anchor="middle" font-size="23" fill="#0F172A">/analyze  /perceive  /chat</text><rect x="1250" y="560" width="580" height="150" rx="18" fill="#6D28D914" stroke="#6D28D9" stroke-width="4"/><text x="1540.0" y="605.0" text-anchor="middle" font-size="30" font-weight="700" fill="#6D28D9">Ollama / LM Studio</text><text x="1540.0" y="643.0" text-anchor="middle" font-size="23" fill="#0F172A">:11434 or :1234 (loopback only)</text><text x="1540.0" y="673.0" text-anchor="middle" font-size="23" fill="#0F172A">none running -&gt; rule engine</text><path d="M1110,325 L1244,325" fill="none" stroke="#C2410C" stroke-width="4" marker-end="url(#a_srv)"/><text x="1177" y="311" text-anchor="middle" font-size="22" font-style="italic" fill="#C2410C" stroke="#fff" stroke-width="7" paint-order="stroke">HTTP</text><path d="M1540,490 L1540,554" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><rect x="1250" y="930" width="580" height="110" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="4" stroke-dasharray="14 10"/><text x="1540.0" y="970.0" text-anchor="middle" font-size="30" font-weight="700" fill="#64748B">Gemini (optional, cloud)</text><text x="1540.0" y="1008.0" text-anchor="middle" font-size="23" fill="#0F172A">only if AIVA_ALLOW_CLOUD=1 + GEMINI_API_KEY</text><path d="M1830,400 L1880,400 L1880,985 L1836,985" fill="none" stroke="#64748B" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#a_cloud)"/><rect x="90" y="930" width="1020" height="110" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="4" stroke-dasharray="14 10"/><text x="600.0" y="970.0" text-anchor="middle" font-size="30" font-weight="700" fill="#64748B">Feedback inbox (external)</text><text x="600.0" y="1008.0" text-anchor="middle" font-size="23" fill="#0F172A">only after explicit opt-in in Settings</text><path d="M870,416 L870,440 L1130,440 L1130,985 L1116,985" fill="none" stroke="#64748B" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#a_cloud)"/></svg>