<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="a_ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker><marker id="a_priv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="a_srv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="a_rej" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="a_llm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="a_cloud" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="a_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="80" y="92" font-size="50" font-weight="800" fill="#0F172A">Workflow 2 - Visual mode: /perceive on CPU</text><text x="80" y="140" font-size="26" fill="#475569">Pixels are masked in the extension before encoding; the server re-masks OCR text; the image is never stored</text><rect x="50" y="190" width="1090" height="275" rx="24" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-dasharray="6 8"/><text x="70" y="226" font-size="24" font-weight="700" fill="#1D4ED8">Browser extension</text><rect x="80" y="280" width="300" height="170" rx="18" fill="#1D4ED814" stroke="#1D4ED8" stroke-width="4"/><text x="230.0" y="320.0" text-anchor="middle" font-size="30" font-weight="700" fill="#1D4ED8">Mask rects</text><text x="230.0" y="358.0" text-anchor="middle" font-size="23" fill="#0F172A">vision-content.js:</text><text x="230.0" y="388.0" text-anchor="middle" font-size="23" fill="#0F172A">sensitive refs, password,</text><text x="230.0" y="418.0" text-anchor="middle" font-size="23" fill="#0F172A">cc-*, OTP (no text)</text><rect x="440" y="280" width="300" height="170" rx="18" fill="#04785714" stroke="#047857" stroke-width="4"/><text x="590.0" y="320.0" text-anchor="middle" font-size="30" font-weight="700" fill="#047857">Black-box pixels</text><text x="590.0" y="358.0" text-anchor="middle" font-size="23" fill="#0F172A">captureVisibleTab -&gt;</text><text x="590.0" y="388.0" text-anchor="middle" font-size="23" fill="#0F172A">OffscreenCanvas &lt;=1280 px</text><text x="590.0" y="418.0" text-anchor="middle" font-size="23" fill="#0F172A">opaque boxes, 4 px pad</text><rect x="800" y="280" width="300" height="170" rx="18" fill="#04785714" stroke="#047857" stroke-width="4"/><text x="950.0" y="320.0" text-anchor="middle" font-size="30" font-weight="700" fill="#047857">Masked JPEG</text><text x="950.0" y="358.0" text-anchor="middle" font-size="23" fill="#0F172A">q0.9, shown to user</text><text x="950.0" y="388.0" text-anchor="middle" font-size="23" fill="#0F172A">in panel first</text><text x="950.0" y="418.0" text-anchor="middle" font-size="23" fill="#0F172A">no rects -&gt; no send</text><path d="M380,365 L434,365" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><path d="M740,365 L794,365" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><rect x="50" y="540" width="1820" height="300" rx="24" fill="none" stroke="#C2410C" stroke-width="3" stroke-dasharray="6 8"/><text x="70" y="576" font-size="24" font-weight="700" fill="#C2410C"></text><text x="330" y="576" text-anchor="start" font-size="24" font-weight="700" fill="#C2410C">Local server  POST /perceive  (token, 4 MB cap, CPU only)</text><rect x="80" y="610" width="320" height="190" rx="18" fill="#C2410C14" stroke="#C2410C" stroke-width="4"/><text x="240.0" y="675.0" text-anchor="middle" font-size="30" font-weight="700" fill="#C2410C">Decode</text><text x="240.0" y="713.0" text-anchor="middle" font-size="23" fill="#0F172A">re-downscale</text><text x="240.0" y="743.0" text-anchor="middle" font-size="23" fill="#0F172A">&lt;= 1280 px</text><rect x="440" y="610" width="320" height="190" rx="18" fill="#C2410C14" stroke="#C2410C" stroke-width="4"/><text x="600.0" y="675.0" text-anchor="middle" font-size="30" font-weight="700" fill="#C2410C">OCR</text><text x="600.0" y="713.0" text-anchor="middle" font-size="23" fill="#0F172A">RapidOCR (ONNX)</text><text x="600.0" y="743.0" text-anchor="middle" font-size="23" fill="#0F172A">PP-OCR det + rec</text><path d="M400,705 L434,705" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><rect x="800" y="610" width="320" height="190" rx="18" fill="#04785714" stroke="#047857" stroke-width="4"/><text x="960.0" y="660.0" text-anchor="middle" font-size="30" font-weight="700" fill="#047857">PII re-mask</text><text x="960.0" y="698.0" text-anchor="middle" font-size="23" fill="#0F172A">OCR strings -&gt; [EMAIL]</text><text x="960.0" y="728.0" text-anchor="middle" font-size="23" fill="#0F172A">[PHONE] ... then NER</text><text x="960.0" y="758.0" text-anchor="middle" font-size="23" fill="#0F172A">NAME_n / ADDRESS_n</text><path d="M760,705 L794,705" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><rect x="1160" y="610" width="320" height="190" rx="18" fill="#C2410C14" stroke="#C2410C" stroke-width="4"/><text x="1320.0" y="675.0" text-anchor="middle" font-size="30" font-weight="700" fill="#C2410C">OpenCV + fuse</text><text x="1320.0" y="713.0" text-anchor="middle" font-size="23" fill="#0F172A">Canny boxes + OCR</text><text x="1320.0" y="743.0" text-anchor="middle" font-size="23" fill="#0F172A">+ DOM boxes (IoU&gt;=0.3)</text><path d="M1120,705 L1154,705" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><rect x="1520" y="610" width="320" height="190" rx="18" fill="#6D28D914" stroke="#6D28D9" stroke-width="4"/><text x="1680.0" y="660.0" text-anchor="middle" font-size="30" font-weight="700" fill="#6D28D9">Elements</text><text x="1680.0" y="698.0" text-anchor="middle" font-size="23" fill="#0F172A">button / input / link ...</text><text x="1680.0" y="728.0" text-anchor="middle" font-size="23" fill="#0F172A">bbox, ids v1..vN</text><text x="1680.0" y="758.0" text-anchor="middle" font-size="23" fill="#0F172A">-&gt; /analyze</text><path d="M1480,705 L1514,705" fill="none" stroke="#0F172A" stroke-width="4" marker-end="url(#a_ink)"/><path d="M950,450 L950,515 L240,515 L240,604" fill="none" stroke="#1D4ED8" stroke-width="4" marker-end="url(#a_ext)"/><text x="600" y="507" text-anchor="middle" font-size="22" font-style="italic" fill="#1D4ED8" stroke="#fff" stroke-width="7" paint-order="stroke">PERCEIVE via background.js serverFetch</text><text x="80" y="900" text-anchor="start" font-size="24" font-weight="400" fill="#0F172A">Measured (Ryzen 7 7730U, no GPU): ~0.4-0.9 s per form, ~2.0-2.2 s text-dense page. OCR is &gt;95% of the time.</text><text x="80" y="940" text-anchor="start" font-size="24" font-weight="400" fill="#0F172A">Models: ~15 MB OCR (ONNX) + ~12 MB spaCy. No PyTorch, no GPU.</text><rect x="80" y="1025" width="26" height="26" rx="6" fill="#1D4ED822" stroke="#1D4ED8" stroke-width="3"/><text x="116" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Browser extension (on-device)</text><rect x="485" y="1025" width="26" height="26" rx="6" fill="#04785722" stroke="#047857" stroke-width="3"/><text x="521" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Privacy step</text><rect x="703" y="1025" width="26" height="26" rx="6" fill="#C2410C22" stroke="#C2410C" stroke-width="3"/><text x="739" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Local server 127.0.0.1:8000</text><rect x="1086" y="1025" width="26" height="26" rx="6" fill="#6D28D922" stroke="#6D28D9" stroke-width="3"/><text x="1122" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Local LLM / rules</text><rect x="1359" y="1025" width="26" height="26" rx="6" fill="#B91C1C22" stroke="#B91C1C" stroke-width="3"/><text x="1395" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Rejected</text><rect x="1533" y="1025" width="26" height="26" rx="6" fill="#64748B22" stroke="#64748B" stroke-width="3"/><text x="1569" y="1045" text-anchor="start" font-size="21" font-weight="400" fill="#0F172A">Optional cloud (off by default)</text></svg>